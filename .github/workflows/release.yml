# A tag produces a release. Merges to main do not: release-pr.yml batches
# those into one pull request, and tag-release.yml tags the merge.
#
# Nothing here rewrites the source it is building. The version in
# package.json and the tag are checked against each other and publication
# stops if they disagree. release-pr.yml does the bump, in a real commit,
# before the tag exists.
name: Release Pipeline

on:
  push:
    tags: ['v*']
  # Dispatching at a branch exercises the binary build and stops before
  # publication. Dispatching at a tag publishes, which is how a failed
  # release is retried.
  workflow_dispatch:
  # The first time the binary build runs should not be the release.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-pr.yml'
      - '.github/workflows/tag-release.yml'
      - 'cliff.toml'
      - 'scripts/brew-sha.sh'
      - 'scripts/update-homebrew-formula.js'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # npmjs trusted publishing. This job is the one the package's trusted
  # publisher names (workflow filename release.yml). It does not run on a
  # merge to main.
  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing for gh-manager-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Setup npm trusted publishing
        run: |
          # Use a token-free config instead of setup-node's NODE_AUTH_TOKEN placeholder.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-oidc.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          # Use an npm version that supports OIDC trusted publishing.
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Publish to npm
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} but package.json says ${manifest}"
            exit 1
          fi
          if npm view "gh-manager-cli@${manifest}" version >/dev/null 2>&1; then
            echo "::notice::gh-manager-cli@${manifest} is already on npm"
            exit 0
          fi
          npm publish --access public --provenance

  # Build binaries for multiple platforms
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ''
          - os: macos-latest
            platform: macos
            arch: x64
            ext: ''
          - os: windows-latest
            platform: windows
            arch: x64
            ext: '.exe'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Create binary
        # node22: pkg-fetch v3.6 no longer ships node20-*-win-x64 (GMC-52).
        # Use the project-pinned @yao-pkg/pkg rather than a floating global latest.
        run: pnpm exec pkg dist/index.js --targets node22-${{ matrix.platform }}-${{ matrix.arch }} --output gh-manager-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gh-manager-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: gh-manager-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 90

  # Create GitHub release and upload binaries
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./binaries

      - name: Display downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la ./binaries/
          find ./binaries -type f -exec ls -la {} \;

      - name: Get version and changelog
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          
          # Extract changelog for this version.
          # NOTE: a naive awk range "/start/,/end/" collapses to a single line here,
          # because the version's own heading also matches the generic version-number
          # end pattern. Use a flag-based scan that consumes the start heading before
          # testing for the next version heading.
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(awk -v ver="$VERSION" '
              BEGIN { gsub(/\./, "\\.", ver) }   # match version dots literally, not as regex wildcards
              !started && $0 ~ ("^#+ \\[?" ver "\\]?") { started=1; print; next }
              started && /^#+ \[?[0-9]+\.[0-9]+\.[0-9]+\]?/ { exit }
              started { print }
            ' CHANGELOG.md)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="# Release v${VERSION}"
            fi
            # Save to file for GitHub release
            echo "$CHANGELOG" > release_notes.md
          else
            echo "# Release v${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if release already exists
          if gh release view v${VERSION} > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
          else
            echo "Creating release v${VERSION}..."
            gh release create v${VERSION} \
              --title "v${VERSION}" \
              --notes-file release_notes.md \
              --verify-tag \
              --draft
          fi

      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Published releases may be immutable. A retry must not alter them.
          if [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft)" = "false" ]; then
            echo "Release is already published; checking its assets in the next step"
            exit 0
          fi
          files=(
            binaries/gh-manager-cli-linux-x64/gh-manager-cli-linux-x64
            binaries/gh-manager-cli-macos-x64/gh-manager-cli-macos-x64
            binaries/gh-manager-cli-windows-x64/gh-manager-cli-windows-x64.exe
          )
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty release binary: $file"
              exit 1
            fi
          done
          gh release upload "v${VERSION}" "${files[@]}" --clobber

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          release=$(gh release view "v${VERSION}" --json isDraft,assets)
          for name in gh-manager-cli-linux-x64 gh-manager-cli-macos-x64 gh-manager-cli-windows-x64.exe; do
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name and .size > 0)' <<< "$release" >/dev/null; then
              echo "::error::Release is missing binary asset: $name"
              exit 1
            fi
          done
          if [ "$(jq -r .isDraft <<< "$release")" = "true" ]; then
            gh release edit "v${VERSION}" --draft=false
          else
            echo "Release is already published with all binary assets"
          fi

  # Publish to other registries and update Homebrew
  publish-extras:
    needs: [create-release, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # One tap update at a time. A pull request's skipped job must not sit
    # in the same slot as a real release: concurrency is joined before the
    # job-level if.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'homebrew-tap-gh-manager-cli' || format('homebrew-tap-gh-manager-cli-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The formula commit is the only write, and it is in another repository.
          owner: stealth-factory
          repositories: homebrew-tap
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Git identity
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # --global so the later clone of homebrew-tap inherits the identity.
          # This job does not commit in the gh-manager-cli checkout.
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "Publishing version ${VERSION} to GitHub Packages..."
          
          NPM_CONFIG_USERCONFIG=$(mktemp)
          PACKAGE_BACKUP=$(mktemp)
          cp package.json "$PACKAGE_BACKUP"
          export NPM_CONFIG_USERCONFIG
          trap 'cp "$PACKAGE_BACKUP" package.json; rm -f "$PACKAGE_BACKUP" "$NPM_CONFIG_USERCONFIG"' EXIT
          echo "@stealth-factory:registry=https://npm.pkg.github.com" > "$NPM_CONFIG_USERCONFIG"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"

          # Check if this version already exists in GitHub Packages
          if npm view @stealth-factory/gh-manager-cli@${VERSION} --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "::notice::Version ${VERSION} already exists in GitHub Packages, skipping publish"
            exit 0
          fi

          # Override the archive's publish registry and restore the checkout on exit.
          jq '.name = "@stealth-factory/gh-manager-cli" | .publishConfig.registry = "https://npm.pkg.github.com"' "$PACKAGE_BACKUP" > package.json
          TARBALL=$(npm pack --json --ignore-scripts | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")
          npm publish "$TARBALL" --registry=https://npm.pkg.github.com
          rm -f "$TARBALL"

      - name: Update Homebrew Tap
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -o pipefail
          # altabella was removed from this repository. The tap push needs the App token.
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Homebrew tap update requires the org GitHub App token with write access to stealth-factory/homebrew-tap"
            exit 1
          fi
          
          echo "Updating Homebrew tap for version ${VERSION}..."
          
          # Hash the exact public registry tarball that Homebrew will download.
          SHA256=$(bash scripts/brew-sha.sh "$VERSION" | awk '/^sha256:/ {print $2}')
          echo "SHA256: $SHA256"

          # The Git identity step configured the App bot before this step.
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/stealth-factory/homebrew-tap.git tap-repo
          
          # Update the formula
          FORMULA="tap-repo/Formula/gh-manager-cli.rb"
          node scripts/update-homebrew-formula.js "$FORMULA" "$VERSION" "$SHA256"

          # Commit and push
          cd tap-repo
          git add Formula/gh-manager-cli.rb
          if git diff --cached --quiet; then
            echo "::notice::Homebrew formula already matches version ${VERSION}"
          else
            git commit -m "chore: update gh-manager-cli to ${VERSION}"
            git push origin main
          fi
